name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Check package invariants
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Client adapter tests
        run: node --test tests/client-adapters.test.mjs

      - name: Representative skill scripts
        run: |
          node skills/lodestar-audit/scripts/audit-state.mjs validate-input --root tests/fixtures/repos/valid
          node skills/lodestar-audit/scripts/source-scan.mjs --recipe explicit-any --root tests/fixtures/repos/valid
          node skills/lodestar-fix/scripts/action-state.mjs list --run-dir tests/fixtures/audit-runs/fix-ready
          node skills/lodestar-setup/scripts/resolve-bin.mjs node

      - name: Verify installer discovery (exactly four)
        env:
          # The `skills` CLI emits ANSI color codes even to a non-TTY CI
          # runner, which split literal substrings like "Found 4 skills"
          # across escape sequences and broke the greps below.
          NO_COLOR: "1"
        run: |
          out=$(pnpm dlx skills add . --list)
          echo "$out"
          echo "$out" | grep -q lodestar-setup
          echo "$out" | grep -q lodestar-audit
          echo "$out" | grep -q lodestar-fix
          echo "$out" | grep -q lodestar-architecture
          echo "$out" | grep -q 'Found 4 skills'

      - name: Native Claude plugin validator when available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "Skipping native Claude validator (CLI not installed on runner)"
          fi

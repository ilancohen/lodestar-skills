name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check package invariants
        run: node scripts/check_package.mjs

      - name: Unit tests
        run: node --test tests/*.test.mjs

      - name: Validate Agent Skills
        run: |
          for skill in skills/ep-*; do
            uvx --from skills-ref agentskills validate "$skill"
          done

      - name: Verify installer discovery
        run: npx --yes skills add . --list

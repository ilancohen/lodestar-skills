name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Check package invariants
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Representative skill scripts
        run: |
          node skills/ep-audit/scripts/audit-state.mjs validate-input --root tests/fixtures/repos/valid
          node skills/ep-audit/scripts/source-scan.mjs --recipe explicit-any --root tests/fixtures/repos/valid
          node skills/ep-fix/scripts/action-state.mjs list --run-dir tests/fixtures/audit-runs/fix-ready
          node skills/ep-setup/scripts/resolve-bin.mjs node

      - name: Verify installer discovery
        run: pnpm dlx skills add . --list

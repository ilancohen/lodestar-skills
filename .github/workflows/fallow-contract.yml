name: Fallow contract

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly probe of the latest fallow release without auto-expanding support.
    - cron: "17 6 * * 1"

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Install pinned Fallow in fixture repo
        working-directory: tests/fixtures/repos/fallow-contract
        run: npm install --save-dev fallow@3.15.0

      - name: Unit + fixture contract tests
        run: node --test tests/fallow-contract.test.mjs

      - name: Live command matrix
        env:
          FALLOW_CONTRACT_LIVE: "1"
          FALLOW_CONTRACT_VERSION: "3.15.0"
        run: node --test tests/fallow-contract.test.mjs

  latest-probe:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Report latest fallow without expanding support
        run: |
          latest=$(npm view fallow version)
          current=$(node -e "console.log(JSON.parse(require('fs').readFileSync('skills/lodestar-audit/scripts/fallow-contract.json','utf8')).tool_version)")
          echo "latest=$latest current=$current"
          if [ "$latest" != "$current" ]; then
            echo "::warning::Newest fallow $latest differs from pinned $current. Do not expand the contract without regenerating fixtures and human review."
          fi

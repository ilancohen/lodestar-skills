name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Release checks
        run: node scripts/release_check.mjs --allow-existing-tag

      - name: Package validation
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Clean-checkout smoke
        run: node scripts/smoke_install.mjs

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          gh release create "${GITHUB_REF_NAME}" \
            --title "lodestar ${version}" \
            --notes-file CHANGELOG.md \
            --verify-tag
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: |
            VERSION
            CHANGELOG.md
            UPGRADING.md
          if-no-files-found: warn
          retention-days: 90

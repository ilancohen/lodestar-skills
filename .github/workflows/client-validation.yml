name: Client adapters

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  adapters:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Package + adapter invariants
        run: pnpm check

      - name: Client adapter tests
        run: node --test tests/client-adapters.test.mjs

      - name: Installer discovery (exactly four)
        run: |
          out=$(pnpm dlx skills add . --list)
          echo "$out"
          echo "$out" | grep -q ep-setup
          echo "$out" | grep -q ep-audit
          echo "$out" | grep -q ep-fix
          echo "$out" | grep -q ep-review-architecture

      - name: Native Claude plugin validator when available
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate .
          else
            echo "Skipping native Claude validator (CLI not installed on runner)"
          fi

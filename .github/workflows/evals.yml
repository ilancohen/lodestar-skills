name: Evals

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install

      - name: Plan eval runs
        run: node evals/runner.mjs

      - name: Validate eval cases and planned artifacts
        run: node evals/validate.mjs --require-results

      - name: Upload planned results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: error
          retention-days: 90
